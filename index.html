<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nameset Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #242440;
    --surface-raised: #2e2e4a;
    --border: #3a3a5c;
    --text: #e8e8f0;
    --text-dim: #8888a8;
    --accent: #4caf7c;
    --accent-hover: #5cc98e;
    --canvas-checker: #d8d8d8;
    --canvas-checker-alt: #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }

  .header {
    grid-column: 1 / -1;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header .badge {
    font-size: 0.7rem;
    font-weight: 500;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    position: relative;
    overflow: auto;
  }

  .canvas-wrapper {
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
  }

  .canvas-wrapper.transparent-bg {
    background-image:
      linear-gradient(45deg, var(--canvas-checker) 25%, transparent 25%),
      linear-gradient(-45deg, var(--canvas-checker) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--canvas-checker) 75%),
      linear-gradient(-45deg, transparent 75%, var(--canvas-checker) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    cursor: grab;
  }

  canvas:active {
    cursor: grabbing;
  }

  .panel {
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-section h3 {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-dim);
  }

  .field input[type="text"],
  .field input[type="number"],
  .field select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.875rem;
    font-family: inherit;
    outline: none;
    transition: border-color 150ms ease-out;
  }

  .field input:focus,
  .field select:focus {
    border-color: var(--accent);
  }

  .field input[type="number"] {
    width: 100%;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .row .field {
    flex: 1;
  }

  .color-field {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .color-field input[type="color"] {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
    background: var(--surface);
  }

  .color-field input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  .color-field input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 4px;
  }

  .color-field input[type="text"] {
    flex: 1;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }

  .toggle-row label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-dim);
  }

  .toggle {
    width: 40px;
    height: 22px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 11px;
    cursor: pointer;
    position: relative;
    transition: background 200ms ease-out;
  }

  .toggle.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  .toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--text);
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: transform 200ms ease-out;
  }

  .toggle.active::after {
    transform: translateX(18px);
  }

  .slider-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slider-field .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slider-field .slider-header label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-dim);
  }

  .slider-field .slider-header span {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .slider-field input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--surface-raised);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .slider-field input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  .export-section {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .export-section h3 {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .export-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 150ms ease-out;
    text-align: center;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a1a2e;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-secondary {
    background: var(--surface-raised);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-small {
    padding: 6px 12px;
    font-size: 0.75rem;
  }

  .dimensions-display {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: center;
    padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-style: italic;
    padding: 4px 0;
  }

  .logo-upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 150ms ease-out;
  }

  .logo-upload-area:hover {
    border-color: var(--accent);
  }

  .logo-upload-area.has-logo {
    border-style: solid;
    padding: 8px;
  }

  .logo-upload-area img {
    max-width: 80px;
    max-height: 60px;
    display: block;
    margin: 0 auto 8px;
  }

  .logo-upload-area p {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .logo-controls {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .center-btn {
    margin-top: 4px;
  }

  @media (max-width: 768px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      height: auto;
      min-height: 100vh;
    }

    .panel {
      border-left: none;
      border-top: 1px solid var(--border);
      max-height: 50vh;
    }

    .canvas-area {
      min-height: 300px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Nameset Generator</h1>
    <span class="badge">Decal Tool</span>
  </header>

  <div class="canvas-area">
    <div class="canvas-wrapper transparent-bg" id="canvasWrapper">
      <canvas id="canvas" width="800" height="1000"></canvas>
    </div>
  </div>

  <aside class="panel">
    <div class="panel-section">
      <h3>Text</h3>
      <div class="field">
        <label>Player Name</label>
        <input type="text" id="playerName" value="LAMMENS" placeholder="SURNAME">
      </div>
      <div class="field">
        <label>Number</label>
        <input type="text" id="playerNumber" value="1" placeholder="1-99">
      </div>
    </div>

    <div class="panel-section">
      <h3>Colors</h3>
      <div class="field">
        <label>Fill Color</label>
        <div class="color-field">
          <input type="color" id="fillColor" value="#1a1a4e">
          <input type="text" id="fillColorHex" value="#1a1a4e" maxlength="7">
        </div>
      </div>
      <div class="field">
        <label>Outline Color</label>
        <div class="color-field">
          <input type="color" id="outlineColor" value="#ffffff">
          <input type="text" id="outlineColorHex" value="#ffffff" maxlength="7">
        </div>
      </div>
      <div class="field">
        <label>Background Color</label>
        <div class="color-field">
          <input type="color" id="bgColor" value="#ffffff">
          <input type="text" id="bgColorHex" value="#ffffff" maxlength="7">
        </div>
      </div>
      <div class="toggle-row">
        <label>Transparent Background</label>
        <div class="toggle active" id="transparentToggle"></div>
      </div>
      <div class="toggle-row">
        <label>Show Outline</label>
        <div class="toggle active" id="outlineToggle"></div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Dimensions</h3>
      <div class="row">
        <div class="field">
          <label>Width (px)</label>
          <input type="number" id="canvasWidth" value="800" min="200" max="4000" step="50">
        </div>
        <div class="field">
          <label>Height (px)</label>
          <input type="number" id="canvasHeight" value="1000" min="200" max="4000" step="50">
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Layout</h3>
      <p class="hint">Drag name, number, or logo freely. Grid snaps as a guide. Green line shows center alignment.</p>
      <button class="btn btn-secondary btn-small center-btn" onclick="centerAll()">Centre All Horizontally</button>
      <div class="slider-field">
        <div class="slider-header">
          <label>Name Arc</label>
          <span id="arcValue">25&deg;</span>
        </div>
        <input type="range" id="nameArc" min="0" max="80" value="25">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Name Size</label>
          <span id="nameSizeValue">13%</span>
        </div>
        <input type="range" id="nameSize" min="6" max="30" value="13">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Number Size</label>
          <span id="numberSizeValue">55%</span>
        </div>
        <input type="range" id="numberSize" min="30" max="80" value="55">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Name Letter Spacing</label>
          <span id="nameSpacingValue">0px</span>
        </div>
        <input type="range" id="nameSpacing" min="-10" max="40" value="0">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Number Letter Spacing</label>
          <span id="numberSpacingValue">0px</span>
        </div>
        <input type="range" id="numberSpacing" min="-10" max="60" value="0">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Outline Thickness</label>
          <span id="outlineThicknessValue">4%</span>
        </div>
        <input type="range" id="outlineThickness" min="1" max="12" value="4">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Grid Size</label>
          <span id="gridSizeValue">20px</span>
        </div>
        <input type="range" id="gridSize" min="5" max="50" value="20">
      </div>
      <div class="toggle-row">
        <label>Show Grid</label>
        <div class="toggle" id="gridToggle"></div>
      </div>
      <div class="toggle-row">
        <label>Snap to Grid</label>
        <div class="toggle active" id="snapToggle"></div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Logo</h3>
      <div class="logo-upload-area" id="logoUploadArea">
        <p>Click or drag to upload PL logo</p>
        <input type="file" id="logoFileInput" accept="image/*" style="display:none">
      </div>
      <div class="slider-field">
        <div class="slider-header">
          <label>Logo Size</label>
          <span id="logoSizeValue">8%</span>
        </div>
        <input type="range" id="logoSize" min="3" max="20" value="8">
      </div>
      <div class="logo-controls" id="logoControls" style="display:none">
        <button class="btn btn-secondary btn-small" onclick="removeLogo()">Remove Logo</button>
      </div>
    </div>

    <div class="export-section">
      <h3>Export</h3>
      <div class="dimensions-display" id="dimDisplay">800 &times; 1000 px</div>
      <div class="export-buttons">
        <button class="btn btn-primary" onclick="exportImage('png')">PNG</button>
        <button class="btn btn-secondary" onclick="exportImage('jpeg')">JPEG</button>
        <button class="btn btn-secondary" onclick="exportImage('webp')">WebP</button>
        <button class="btn btn-secondary" onclick="exportImage('svg')">SVG</button>
      </div>
    </div>
  </aside>
</div>

<script>
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var wrapper = document.getElementById('canvasWrapper');

// PL-style font
var PL_FONT = 'PLFont';
var fontFace = new FontFace('PLFont', "url('https://fonts.gstatic.com/s/anton/v25/1Ptgg87GROyAm3K9-C8.woff2')", {
  weight: 'normal',
  style: 'normal'
});
fontFace.load().then(function(loaded) {
  document.fonts.add(loaded);
  render();
});

// State
var state = {
  name: 'LAMMENS',
  number: '1',
  fillColor: '#1a1a4e',
  outlineColor: '#ffffff',
  bgColor: '#ffffff',
  transparent: true,
  showOutline: true,
  width: 800,
  height: 1000,
  arc: 25,
  nameSize: 13,
  numberSize: 55,
  nameSpacing: 0,
  numberSpacing: 0,
  outlineThickness: 4,
  gridSize: 20,
  showGrid: false,
  snapToGrid: true,
  nameX: 50,
  nameY: 20,
  numberX: 50,
  numberY: 58,
  logoImage: null,
  logoX: 50,
  logoY: 82,
  logoSize: 8
};

// Snap guides state (for visual feedback)
var snapGuides = {
  centerX: false,
  centerY: false
};

// Drag state
var drag = {
  active: false,
  target: null,
  offsetX: 0,
  offsetY: 0
};

// Bind inputs
function bindInput(id, key, transform) {
  transform = transform || function(v) { return v; };
  var el = document.getElementById(id);
  el.addEventListener('input', function() {
    state[key] = transform(el.value);
    render();
  });
}

bindInput('playerName', 'name', function(v) { return v.toUpperCase(); });
bindInput('playerNumber', 'number');
bindInput('nameArc', 'arc', Number);
bindInput('nameSize', 'nameSize', Number);
bindInput('numberSize', 'numberSize', Number);
bindInput('nameSpacing', 'nameSpacing', Number);
bindInput('numberSpacing', 'numberSpacing', Number);
bindInput('outlineThickness', 'outlineThickness', Number);
bindInput('gridSize', 'gridSize', Number);
bindInput('logoSize', 'logoSize', Number);

// Color sync helper
function syncColor(pickerId, hexId, stateKey) {
  var picker = document.getElementById(pickerId);
  var hex = document.getElementById(hexId);

  picker.addEventListener('input', function() {
    state[stateKey] = picker.value;
    hex.value = picker.value;
    render();
  });

  hex.addEventListener('input', function() {
    if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) {
      state[stateKey] = hex.value;
      picker.value = hex.value;
      render();
    }
  });
}

syncColor('fillColor', 'fillColorHex', 'fillColor');
syncColor('outlineColor', 'outlineColorHex', 'outlineColor');
syncColor('bgColor', 'bgColorHex', 'bgColor');

// Toggles
function setupToggle(id, stateKey, extraFn) {
  var el = document.getElementById(id);
  el.addEventListener('click', function() {
    state[stateKey] = !state[stateKey];
    el.classList.toggle('active', state[stateKey]);
    if (extraFn) extraFn();
    render();
  });
}

setupToggle('transparentToggle', 'transparent', function() {
  wrapper.classList.toggle('transparent-bg', state.transparent);
});
setupToggle('outlineToggle', 'showOutline');
setupToggle('gridToggle', 'showGrid');
setupToggle('snapToggle', 'snapToGrid');

// Dimensions
var widthInput = document.getElementById('canvasWidth');
var heightInput = document.getElementById('canvasHeight');
var dimDisplay = document.getElementById('dimDisplay');

widthInput.addEventListener('change', function() {
  state.width = Math.max(200, Math.min(4000, Number(widthInput.value)));
  widthInput.value = state.width;
  canvas.width = state.width;
  dimDisplay.textContent = state.width + ' \u00d7 ' + state.height + ' px';
  render();
});

heightInput.addEventListener('change', function() {
  state.height = Math.max(200, Math.min(4000, Number(heightInput.value)));
  heightInput.value = state.height;
  canvas.height = state.height;
  dimDisplay.textContent = state.width + ' \u00d7 ' + state.height + ' px';
  render();
});

// Slider value displays
document.getElementById('nameArc').addEventListener('input', function() {
  document.getElementById('arcValue').textContent = this.value + '\u00b0';
});
document.getElementById('nameSize').addEventListener('input', function() {
  document.getElementById('nameSizeValue').textContent = this.value + '%';
});
document.getElementById('numberSize').addEventListener('input', function() {
  document.getElementById('numberSizeValue').textContent = this.value + '%';
});
document.getElementById('nameSpacing').addEventListener('input', function() {
  document.getElementById('nameSpacingValue').textContent = this.value + 'px';
});
document.getElementById('numberSpacing').addEventListener('input', function() {
  document.getElementById('numberSpacingValue').textContent = this.value + 'px';
});
document.getElementById('outlineThickness').addEventListener('input', function() {
  document.getElementById('outlineThicknessValue').textContent = this.value + '%';
});
document.getElementById('gridSize').addEventListener('input', function() {
  document.getElementById('gridSizeValue').textContent = this.value + 'px';
});
document.getElementById('logoSize').addEventListener('input', function() {
  document.getElementById('logoSizeValue').textContent = this.value + '%';
});

// Logo upload
var logoUploadArea = document.getElementById('logoUploadArea');
var logoFileInput = document.getElementById('logoFileInput');
var logoControls = document.getElementById('logoControls');

logoUploadArea.addEventListener('click', function() {
  logoFileInput.click();
});

logoUploadArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  logoUploadArea.style.borderColor = 'var(--accent)';
});

logoUploadArea.addEventListener('dragleave', function() {
  logoUploadArea.style.borderColor = '';
});

logoUploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  logoUploadArea.style.borderColor = '';
  var file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    loadLogoFile(file);
  }
});

logoFileInput.addEventListener('change', function() {
  if (this.files[0]) {
    loadLogoFile(this.files[0]);
  }
});

function loadLogoFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      state.logoImage = img;
      logoUploadArea.classList.add('has-logo');
      logoUploadArea.innerHTML = '<img src="' + e.target.result + '"><p>' + file.name + '</p>';
      logoControls.style.display = 'flex';
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  state.logoImage = null;
  logoUploadArea.classList.remove('has-logo');
  logoUploadArea.innerHTML = '<p>Click or drag to upload PL logo</p>';
  logoControls.style.display = 'none';
  logoFileInput.value = '';
  render();
}

// Centre all elements horizontally
function centerAll() {
  state.nameX = 50;
  state.numberX = 50;
  state.logoX = 50;
  render();
}

// Snap value to grid (only if snap enabled)
function snapValue(value, gridSize) {
  if (!state.snapToGrid) return value;
  return Math.round(value / gridSize) * gridSize;
}

// Get mouse/touch position relative to canvas
function getCanvasPos(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = state.width / rect.width;
  var scaleY = state.height / rect.height;
  var clientX, clientY;

  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

// Hit test
function hitTest(px, py) {
  var w = state.width;
  var h = state.height;

  // Logo hit area
  if (state.logoImage) {
    var logoX = (state.logoX / 100) * w;
    var logoY = (state.logoY / 100) * h;
    var logoH = (state.logoSize / 100) * h;
    var logoW = logoH * (state.logoImage.width / state.logoImage.height);
    if (px > logoX - logoW/2 - 15 && px < logoX + logoW/2 + 15 && py > logoY - logoH/2 - 15 && py < logoY + logoH/2 + 15) {
      return 'logo';
    }
  }

  // Number hit area
  var numX = (state.numberX / 100) * w;
  var numY = (state.numberY / 100) * h;
  var numFontSize = (state.numberSize / 100) * h;
  var numHalfW = numFontSize * 0.8;
  var numHalfH = numFontSize * 0.6;

  if (px > numX - numHalfW && px < numX + numHalfW && py > numY - numHalfH && py < numY + numHalfH) {
    return 'number';
  }

  // Name hit area
  var nameX = (state.nameX / 100) * w;
  var nameY = (state.nameY / 100) * h;
  var nameFontSize = (state.nameSize / 100) * w;
  var nameHalfW = Math.max(state.name.length * nameFontSize * 0.5, nameFontSize * 2);
  var nameHalfH = nameFontSize * 1.2;

  if (px > nameX - nameHalfW && px < nameX + nameHalfW && py > nameY - nameHalfH && py < nameY + nameHalfH) {
    return 'name';
  }

  return null;
}

// Drag handlers
canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('touchstart', startDrag);
document.addEventListener('mousemove', moveDrag);
document.addEventListener('touchmove', moveDrag);
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function startDrag(e) {
  e.preventDefault();
  var pos = getCanvasPos(e);
  var target = hitTest(pos.x, pos.y);

  if (target) {
    drag.active = true;
    drag.target = target;
    drag.offsetX = pos.x - (state[target + 'X'] / 100) * state.width;
    drag.offsetY = pos.y - (state[target + 'Y'] / 100) * state.height;
  }
}

function moveDrag(e) {
  if (!drag.active) return;
  e.preventDefault();

  var pos = getCanvasPos(e);
  var rawX = pos.x - drag.offsetX;
  var rawY = pos.y - drag.offsetY;

  // Apply grid snap if enabled
  var grid = state.gridSize;
  var finalX = state.snapToGrid ? snapValue(rawX, grid) : rawX;
  var finalY = state.snapToGrid ? snapValue(rawY, grid) : rawY;

  // Check proximity to center for visual guide (not forced)
  var centerX = state.width / 2;
  var centerY = state.height / 2;
  var snapThreshold = grid * 0.75;

  snapGuides.centerX = Math.abs(finalX - centerX) < snapThreshold;
  snapGuides.centerY = Math.abs(finalY - centerY) < snapThreshold;

  // Gentle center snap: only snap if VERY close (within half a grid unit)
  if (snapGuides.centerX && state.snapToGrid) {
    finalX = centerX;
  }
  if (snapGuides.centerY && state.snapToGrid) {
    finalY = centerY;
  }

  // Convert to percentage (no clamping, full freedom)
  state[drag.target + 'X'] = (finalX / state.width) * 100;
  state[drag.target + 'Y'] = (finalY / state.height) * 100;

  render();
}

function endDrag() {
  drag.active = false;
  drag.target = null;
  snapGuides.centerX = false;
  snapGuides.centerY = false;
  render();
}

// Draw text with letter spacing
function drawTextWithSpacing(text, x, y, spacing, align) {
  if (!text) return;
  if (spacing === 0) {
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    if (state.showOutline) {
      ctx.strokeText(text, x, y);
    }
    ctx.fillText(text, x, y);
    return;
  }

  var chars = text.split('');
  var charWidths = chars.map(function(c) { return ctx.measureText(c).width; });
  var totalWidth = charWidths.reduce(function(a, b) { return a + b; }, 0) + spacing * (chars.length - 1);

  var startX = x - totalWidth / 2;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  chars.forEach(function(char, i) {
    if (state.showOutline) {
      ctx.strokeText(char, startX, y);
    }
    ctx.fillText(char, startX, y);
    startX += charWidths[i] + spacing;
  });
}

// Draw arced text with letter spacing and outline
function drawArcText(text, centerX, centerY, radius, arcAngle, spacing) {
  if (!text) return;

  if (arcAngle === 0) {
    drawTextWithSpacing(text, centerX, centerY, spacing, 'center');
    return;
  }

  var totalAngle = (arcAngle * Math.PI) / 180;
  var chars = text.split('');
  var charWidths = chars.map(function(c) { return ctx.measureText(c).width; });
  var totalWidth = charWidths.reduce(function(a, b) { return a + b; }, 0) + spacing * (chars.length - 1);

  var anglePerPixel = totalAngle / totalWidth;
  var currentAngle = -Math.PI / 2 - totalAngle / 2;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  chars.forEach(function(char, i) {
    var halfCharAngle = (charWidths[i] / 2) * anglePerPixel;
    currentAngle += halfCharAngle;

    var charX = centerX + radius * Math.cos(currentAngle);
    var charY = centerY + radius * Math.sin(currentAngle);

    ctx.save();
    ctx.translate(charX, charY);
    ctx.rotate(currentAngle + Math.PI / 2);
    if (state.showOutline) {
      ctx.strokeText(char, 0, 0);
    }
    ctx.fillText(char, 0, 0);
    ctx.restore();

    currentAngle += halfCharAngle + spacing * anglePerPixel;
  });
}

// Draw grid and guides
function drawGrid() {
  var w = state.width;
  var h = state.height;
  var grid = state.gridSize;

  if (state.showGrid) {
    ctx.save();
    ctx.strokeStyle = 'rgba(100, 150, 255, 0.12)';
    ctx.lineWidth = 1;

    for (var x = grid; x < w; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }

    for (var y = grid; y < h; y += grid) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Center crosshair (always shown with grid)
    ctx.strokeStyle = 'rgba(100, 150, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);

    ctx.beginPath();
    ctx.moveTo(w / 2, 0);
    ctx.lineTo(w / 2, h);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();

    ctx.restore();
  }

  // Snap guide lines (bright green, only during drag)
  if (drag.active) {
    ctx.save();
    ctx.strokeStyle = 'rgba(76, 175, 124, 0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);

    if (snapGuides.centerX) {
      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w / 2, h);
      ctx.stroke();
    }

    if (snapGuides.centerY) {
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

// Main render
function render() {
  var w = state.width;
  var h = state.height;

  ctx.clearRect(0, 0, w, h);

  if (!state.transparent) {
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, w, h);
  }

  drawGrid();

  // Configure text style
  var outlineWidth = (state.outlineThickness / 100) * Math.min(w, h);

  ctx.fillStyle = state.fillColor;
  ctx.strokeStyle = state.outlineColor;
  ctx.lineWidth = outlineWidth;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  // Draw name
  var nameFontSize = (state.nameSize / 100) * w;
  ctx.font = nameFontSize + 'px "PLFont", "Anton", "Impact", "Arial Black", sans-serif';

  var nameX = (state.nameX / 100) * w;
  var nameY = (state.nameY / 100) * h;

  if (state.arc > 0) {
    var textWidth = ctx.measureText(state.name).width + state.nameSpacing * (state.name.length - 1);
    var arcRad = (state.arc * Math.PI) / 180;
    var radius = textWidth / arcRad * 1.2;
    var arcCenterY = nameY + radius;

    drawArcText(state.name, nameX, arcCenterY, radius, state.arc, state.nameSpacing);
  } else {
    drawTextWithSpacing(state.name, nameX, nameY, state.nameSpacing, 'center');
  }

  // Draw number
  var numFontSize = (state.numberSize / 100) * h;
  ctx.font = numFontSize + 'px "PLFont", "Anton", "Impact", "Arial Black", sans-serif';
  ctx.lineWidth = outlineWidth * 1.2;

  var numX = (state.numberX / 100) * w;
  var numY = (state.numberY / 100) * h;

  drawTextWithSpacing(state.number, numX, numY, state.numberSpacing, 'center');

  // Draw logo
  if (state.logoImage) {
    var logoH = (state.logoSize / 100) * h;
    var logoW = logoH * (state.logoImage.width / state.logoImage.height);
    var logoDrawX = (state.logoX / 100) * w - logoW / 2;
    var logoDrawY = (state.logoY / 100) * h - logoH / 2;

    ctx.drawImage(state.logoImage, logoDrawX, logoDrawY, logoW, logoH);
  }
}

// Export
function exportImage(format) {
  var gridWasVisible = state.showGrid;
  var snapWasVisible = snapGuides.centerX || snapGuides.centerY;
  state.showGrid = false;
  snapGuides.centerX = false;
  snapGuides.centerY = false;
  render();

  var link = document.createElement('a');
  var name = state.name || 'nameset';
  var num = state.number || '';
  var filename = (name + '_' + num).replace(/\s+/g, '_');

  if (format === 'svg') {
    var svg = generateSVG();
    var blob = new Blob([svg], { type: 'image/svg+xml' });
    link.href = URL.createObjectURL(blob);
    link.download = filename + '.svg';
  } else {
    var mimeType = 'image/png';
    if (format === 'jpeg') mimeType = 'image/jpeg';
    if (format === 'webp') mimeType = 'image/webp';

    if (format === 'jpeg' && state.transparent) {
      var tempCanvas = document.createElement('canvas');
      tempCanvas.width = state.width;
      tempCanvas.height = state.height;
      var tempCtx = tempCanvas.getContext('2d');
      tempCtx.fillStyle = '#ffffff';
      tempCtx.fillRect(0, 0, state.width, state.height);
      tempCtx.drawImage(canvas, 0, 0);
      link.href = tempCanvas.toDataURL(mimeType, 0.95);
    } else {
      link.href = canvas.toDataURL(mimeType, 0.95);
    }
    link.download = filename + '.' + format;
  }

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  state.showGrid = gridWasVisible;
  render();
}

function generateSVG() {
  var w = state.width;
  var h = state.height;
  var outlineWidth = (state.outlineThickness / 100) * Math.min(w, h);

  var bgRect = '';
  if (!state.transparent) {
    bgRect = '<rect width="' + w + '" height="' + h + '" fill="' + state.bgColor + '"/>';
  }

  var nameFontSize = (state.nameSize / 100) * w;
  var numFontSize = (state.numberSize / 100) * h;
  var nameX = (state.nameX / 100) * w;
  var nameY = (state.nameY / 100) * h;
  var numX = (state.numberX / 100) * w;
  var numY = (state.numberY / 100) * h;

  var strokeAttr = state.showOutline ? ' stroke="' + state.outlineColor + '" stroke-width="' + outlineWidth + '" stroke-linejoin="round" paint-order="stroke fill"' : '';
  var numStrokeAttr = state.showOutline ? ' stroke="' + state.outlineColor + '" stroke-width="' + (outlineWidth * 1.2) + '" stroke-linejoin="round" paint-order="stroke fill"' : '';

  var nameLetterSpacing = state.nameSpacing !== 0 ? ' letter-spacing="' + state.nameSpacing + '"' : '';
  var numLetterSpacing = state.numberSpacing !== 0 ? ' letter-spacing="' + state.numberSpacing + '"' : '';

  var nameElement = '';
  if (state.arc > 0 && state.name) {
    var textWidth = nameFontSize * state.name.length * 0.6 + state.nameSpacing * (state.name.length - 1);
    var arcRad = (state.arc * Math.PI) / 180;
    var radius = textWidth / arcRad * 1.2;

    var startAngle = -Math.PI / 2 - arcRad / 2;
    var endAngle = -Math.PI / 2 + arcRad / 2;
    var cx = nameX;
    var cy = nameY + radius;

    var x1 = cx + radius * Math.cos(startAngle);
    var y1 = cy + radius * Math.sin(startAngle);
    var x2 = cx + radius * Math.cos(endAngle);
    var y2 = cy + radius * Math.sin(endAngle);

    var largeArc = arcRad > Math.PI ? 1 : 0;

    nameElement = '<defs><path id="namePath" d="M ' + x1 + ' ' + y1 + ' A ' + radius + ' ' + radius + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + '"/></defs>' +
      '<text font-family="Anton, Impact, Arial Black, sans-serif" font-size="' + nameFontSize + '" fill="' + state.fillColor + '"' + strokeAttr + nameLetterSpacing + '>' +
      '<textPath href="#namePath" startOffset="50%" text-anchor="middle">' + state.name + '</textPath></text>';
  } else {
    nameElement = '<text x="' + nameX + '" y="' + nameY + '" font-family="Anton, Impact, Arial Black, sans-serif" font-size="' + nameFontSize + '" fill="' + state.fillColor + '"' + strokeAttr + nameLetterSpacing + ' text-anchor="middle" dominant-baseline="middle">' + state.name + '</text>';
  }

  var numberElement = '<text x="' + numX + '" y="' + numY + '" font-family="Anton, Impact, Arial Black, sans-serif" font-size="' + numFontSize + '" fill="' + state.fillColor + '"' + numStrokeAttr + numLetterSpacing + ' text-anchor="middle" dominant-baseline="middle">' + state.number + '</text>';

  var logoElement = '';
  if (state.logoImage) {
    var logoH = (state.logoSize / 100) * h;
    var logoW = logoH * (state.logoImage.width / state.logoImage.height);
    var lx = (state.logoX / 100) * w - logoW / 2;
    var ly = (state.logoY / 100) * h - logoH / 2;

    var tc = document.createElement('canvas');
    tc.width = state.logoImage.width;
    tc.height = state.logoImage.height;
    var tctx = tc.getContext('2d');
    tctx.drawImage(state.logoImage, 0, 0);
    var dataUrl = tc.toDataURL('image/png');

    logoElement = '<image href="' + dataUrl + '" x="' + lx + '" y="' + ly + '" width="' + logoW + '" height="' + logoH + '"/>';
  }

  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">\n  ' + bgRect + '\n  ' + nameElement + '\n  ' + numberElement + '\n  ' + logoElement + '\n</svg>';
}

// Initial render
render();
</script>
</body>
</html>
